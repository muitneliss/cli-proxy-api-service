services:
  cli-proxy-api:
    image: eceasy/cli-proxy-api:latest
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - cli-proxy-api-auth:/root/.cli-proxy-api
    networks:
      - dokploy-network
    restart: always
    pull_policy: always
volumes:
  cli-proxy-api-auth:

networks:
  dokploy-network:
    external: true
